# Runs the three test layers (see README.md) on every push and pull request:
#   1. compile:  ksc accepts the specs for every target (scripts/compile.py --all)
#   2. build:    the generated code builds or loads, per language (scripts/build_check.py)
#   3. decode:   each language decodes every sample to match tests/expected/ (scripts/run_tests.py)
# plus graphviz: the committed diagrams in tests/graphviz/ are up to date (scripts/graphviz.py --check)
# Layers 2 and 3 run for Java, Python, JavaScript, C#, C++, Lua, PHP and Ruby, on
# Ubuntu and Windows (C++ on Ubuntu only). Perl and Rust get layer 1 only: ksc's
# output for them doesn't work for these specs (see README.md).

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  KSC_VERSION: "0.11"
  KSC_SHA256: ff89389d9dc9e770d78a24af328763cb1f8e7b31ce7766c9edf10669a060f2a2
  PYTHON_VERSION: "3.13"
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  LUA_VERSION: "5.4.6"
  LUA_WIN64_SHA256: 24b4e1b3ee77c71199d84a8597f15ad4e11e011b8aac3789b6e2bc805e9844a4
  PHP_VERSION: "8.5"
  RUBY_VERSION: "4.0"

jobs:
  compile:
    name: compile (all ksc targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # ksc runs on Java; Temurin 25 is the JDK the Java tests use too.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ksc
        shell: bash
        run: &install-ksc |
          zip="kaitai-struct-compiler-${KSC_VERSION}.zip"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$zip" "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/${zip}"
          echo "${KSC_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip"
          bin="$RUNNER_TEMP/kaitai-struct-compiler-${KSC_VERSION}/bin"
          # scripts/_common.find_ksc() reads $KSC first.
          if [ "$RUNNER_OS" = Windows ]; then
            echo "KSC=$bin/kaitai-struct-compiler.bat" >> "$GITHUB_ENV"
          else
            echo "KSC=$bin/kaitai-struct-compiler" >> "$GITHUB_ENV"
            "$bin/kaitai-struct-compiler" --version
          fi

      - name: Compile for every target
        run: python scripts/compile.py --all

      - name: Upload ksc output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksc-all
          path: build/ksc-all/
          if-no-files-found: ignore

  graphviz:
    name: graphviz diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ksc
        shell: bash
        run: *install-ksc

      - name: Install Graphviz
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q graphviz
          dot -V

      # The diagrams in tests/graphviz/ are committed: fail if the .dot files are
      # stale, an SVG wasn't rendered from its .dot, a diagram doesn't render, or
      # Graphviz's warnings changed.
      - name: Check the committed diagrams
        run: python scripts/graphviz.py --check

      - name: Regenerate the diagrams
        if: failure()
        run: python scripts/graphviz.py

      - name: Upload the regenerated diagrams
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphviz-diagrams
          path: tests/graphviz/
          if-no-files-found: ignore

  test:
    name: ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target: [java, python, javascript, csharp, cpp, lua, php, ruby]
        exclude:
          # The C++ tests build with GCC and Clang on Linux (in WSL when run
          # locally on Windows); GitHub's Windows runners have no WSL distro.
          - os: windows-latest
            target: cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Every job needs Java for ksc. JAVA_HOME is a Temurin 25, which is what
      # scripts/_common.java_env() and the Gradle toolchain require.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ matrix.target == 'python' && 'pip' || '' }}
          cache-dependency-path: tests/python/requirements.txt

      - name: Install ksc
        shell: bash
        run: *install-ksc

      - name: Set up Gradle
        if: matrix.target == 'java'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # 'enhanced', the default, is a commercial caching service.
          cache-provider: basic

      - name: Set up the Python venv
        if: matrix.target == 'python'
        shell: bash
        run: |
          python -m venv tests/python/.venv
          if [ "$RUNNER_OS" = Windows ]; then py=tests/python/.venv/Scripts/python; else py=tests/python/.venv/bin/python; fi
          "$py" -m pip install --disable-pip-version-check -r tests/python/requirements.txt

      - name: Set up Node
        if: matrix.target == 'javascript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/javascript/package-lock.json

      - name: Set up .NET
        if: matrix.target == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install C++ build tools
        if: matrix.target == 'cpp'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++ clang cmake ninja-build
          g++ --version | head -n 1; clang++ --version | head -n 1; cmake --version | head -n 1

      - name: Install Lua
        if: matrix.target == 'lua'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # The same Lua 5.4 build as winget's DEVCOM.Lua, from its zip.
            zip=Lua-${LUA_VERSION}-win64.zip
            cd "$RUNNER_TEMP"
            curl -fsSL -o "$zip" "https://github.com/DevelopersCommunity/cmake-lua/releases/download/v${LUA_VERSION}/${zip}"
            echo "${LUA_WIN64_SHA256}  ${zip}" | sha256sum -c -
            unzip -q "$zip" -d lua
            echo "LUA=$RUNNER_TEMP/lua/bin/lua.exe" >> "$GITHUB_ENV"
            "$RUNNER_TEMP/lua/bin/lua.exe" -v
          else
            sudo apt-get update -q
            sudo apt-get install -y -q lua5.4
            lua5.4 -v
          fi

      - name: Set up PHP
        if: matrix.target == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          # The runtime needs iconv, PHPUnit dom/mbstring/xml/xmlwriter, and the
          # tests bcmath. composer.phar is fetched (pinned) by the scripts.
          extensions: bcmath, dom, iconv, json, mbstring, openssl, tokenizer, xml, xmlwriter, zip
          tools: none
          coverage: none

      - name: Set up Ruby
        if: matrix.target == 'ruby'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          # The scripts run `bundle install` into tests/ruby/vendor/bundle themselves.
          bundler-cache: false

      - name: Build check
        run: python scripts/build_check.py --target ${{ matrix.target }}

      - name: Decode tests
        run: python scripts/run_tests.py --target ${{ matrix.target }} --no-compile

      - name: Upload Java test reports
        if: failure() && matrix.target == 'java'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports-${{ matrix.os }}
          path: |
            tests/java/build/reports/tests/test/
            tests/java/build/test-results/
          if-no-files-found: ignore
